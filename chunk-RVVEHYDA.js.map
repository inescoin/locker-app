<div class="address-input-container">
    <label *ngIf="label" class="block text-sm font-medium text-gray-700 mb-1">
        {{ label }}
    </label>

    <div class="flex gap-2">
        <input type="text" [(ngModel)]="address" (ngModelChange)="onAddressChange($event)" [placeholder]="placeholder"
            [disabled]="disabled"
            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-violet-500 focus:border-violet-500 font-mono text-sm disabled:bg-gray-100 disabled:text-gray-500" />

        <button type="button" (click)="openScanner()" [disabled]="disabled"
            class="px-4 py-2 bg-violet-600 text-white rounded-lg hover:bg-violet-700 font-medium flex items-center gap-2 disabled:opacity-50 transition-colors shadow-sm"
            title="Scan QR Code">
            <app-icon name="camera" [size]="18"></app-icon>
        </button>

        <button type="button" *ngIf="address" (click)="copyAddress()"
            class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 border border-gray-300 transition-colors"
            title="Copy Address">
            <app-icon name="clipboard" [size]="14"></app-icon>
        </button>
    </div>
</div>

<div *ngIf="showScanner" class="fixed inset-0 z-[110]">
    <app-qr-scanner [fullScreen]="true" [autoStart]="true" (scanSuccess)="handleScan($event)"
        (cancelled)="closeScanner()">
    </app-qr-scanner>
</div>
