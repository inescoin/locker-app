<div *ngIf="isOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm"
    (click)="close()">
    <!-- Modal Panel -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]"
        (click)="$event.stopPropagation()">

        <!-- Header -->
        <div
            class="px-6 py-4 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white z-10 shrink-0">
            <h3 class="text-lg font-bold text-gray-900">
                {{ (isEditMode ? 'CONTACTS.EDIT_CONTACT' : 'CONTACTS.ADD_CONTACT') | translate }}
            </h3>
            <button (click)="close()"
                class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors">
                <app-icon name="x-mark" [size]="20"></app-icon>
            </button>
        </div>

        <!-- Body -->
        <div class="p-6 overflow-y-auto min-h-[min(200px,60vh)]">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        {{ 'CONTACTS.ADDRESS' | translate }} <span *ngIf="!isEditMode">*</span>
                    </label>
                    <app-address-input-qr [(ngModel)]="address" [disabled]="isEditMode" [label]="''"
                        [placeholder]="'CONTACTS.MODAL_ADDRESS_PLACEHOLDER' | translate">
                    </app-address-input-qr>
                    <p *ngIf="isEditMode" class="text-xs text-gray-500 mt-1">{{ 'CONTACTS.ADDRESS_CANT_EDIT' | translate
                        }}</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        {{ 'CONTACTS.LABEL' | translate }}
                    </label>
                    <input type="text" [(ngModel)]="label" [placeholder]="'CONTACTS.LABEL_PLACEHOLDER' | translate"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-violet-500 focus:border-violet-500 text-sm"
                        (keyup.enter)="save()" />
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 shrink-0 flex justify-end gap-3 rounded-b-2xl">
            <button (click)="close()"
                class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors shadow-sm">
                {{ 'CONTACTS.CANCEL' | translate }}
            </button>
            <button (click)="save()"
                class="px-4 py-2 text-sm font-medium text-white bg-violet-600 rounded-lg hover:bg-violet-700 transition-colors shadow-sm flex items-center gap-2">
                <app-icon name="check" [size]="16"></app-icon>
                {{ 'CONTACTS.SAVE' | translate }}
            </button>
        </div>
    </div>
</div>
