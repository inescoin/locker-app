<div class="pricing-banner" [class.early-bird]="isEarlyBird">
    <div class="pricing-container">

        <!-- Early Bird Active -->
        <div *ngIf="isEarlyBird" class="early-bird-active">
            <div class="badge">🎉 EARLY BIRD PRICING</div>
            <div class="price-display">
                <span class="currency">$</span>
                <span class="amount">199</span>
                <span class="regular-price">$499</span>
            </div>
            <div class="remaining">
                <span class="fire">🔥</span>
                Only <strong>{{ remainingSlots }}</strong> slots remaining at this price!
            </div>
            <div class="progress-bar">
                <div class="progress-fill" [style.width.%]="progressPercentage"></div>
            </div>
            <div class="subtext">
                {{ deployedCount }}/1000 early bird deployments claimed
            </div>
        </div>

        <!-- Regular Price -->
        <div *ngIf="!isEarlyBird" class="regular-pricing">
            <div class="badge sold-out">🎯 REGULAR PRICING</div>
            <div class="price-display">
                <span class="currency">$</span>
                <span class="amount">499</span>
            </div>
            <div class="info">
                Early bird slots are sold out. Current price: $499
            </div>
        </div>

        <!-- Loading State -->
        <div *ngIf="loading" class="loading">
            <div class="spinner"></div>
            Loading pricing info...
        </div>

    </div>
</div>
