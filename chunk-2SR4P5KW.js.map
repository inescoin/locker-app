<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog"
    aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">

        <!-- Background overlay -->
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"
            (click)="onCloseClick()"></div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <!-- Modal panel -->
        <div
            class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-xl w-full">
            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                <div class="flex justify-between items-center mb-5">
                    <h3 class="text-lg leading-6 font-bold text-gray-900" id="modal-title">
                        {{ 'CONTACTS.SELECT_ADDRESS' | translate }}
                    </h3>
                    <button (click)="onCloseClick()"
                        class="text-gray-400 hover:text-gray-500 focus:outline-none transition-colors">
                        <app-icon name="x-mark" [size]="20"></app-icon>
                    </button>
                </div>




                <div class="space-y-5">
                    <!-- Contacts Search / List -->
                    <div>
                        <div class="relative rounded-md shadow-sm mb-3">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <app-icon name="magnifying-glass" [size]="16" class="text-gray-400"></app-icon>
                            </div>
                            <input type="text" [ngModel]="searchQuery$ | async" (ngModelChange)="onSearchChange($event)"
                                class="focus:ring-violet-500 focus:border-violet-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-lg py-2"
                                [placeholder]="'CONTACTS.MODAL_SEARCH_PLACEHOLDER' | translate">
                        </div>

                        <div
                            class="max-h-60 overflow-y-auto border border-gray-200 rounded-lg divide-y divide-gray-100 bg-gray-50">
                            <ng-container *ngIf="(filteredContacts$ | async) as contacts">
                                <div *ngIf="contacts.length === 0" class="p-4 text-center text-gray-500 text-sm">
                                    {{ 'CONTACTS.MODAL_NO_RESULTS' | translate }}
                                </div>
                                <div *ngFor="let contact of contacts" (click)="onRowClick(contact.address)"
                                    class="p-3 bg-white hover:bg-violet-50 cursor-pointer flex justify-between items-center transition-colors">
                                    <div class="min-w-0 pr-4">
                                        <p class="text-sm font-bold text-gray-900 truncate">{{ contact.label ||
                                            ('CONTACTS.UNNAMED' | translate) }}</p>
                                        <p class="text-xs text-gray-500 font-mono truncate">{{ contact.address }}
                                        </p>
                                    </div>
                                    <button (click)="deleteContact(contact.address, $event)"
                                        class="text-gray-400 hover:text-red-500 p-1 flex-shrink-0">
                                        <app-icon name="trash" [size]="16"></app-icon>
                                    </button>
                                </div>
                            </ng-container>
                        </div>
                    </div>

                    <div class="relative">
                        <div class="absolute inset-0 flex items-center" aria-hidden="true">
                            <div class="w-full border-t border-gray-200"></div>
                        </div>
                        <div class="relative flex justify-center">
                            <span class="px-2 bg-white text-xs text-gray-400 font-medium uppercase">{{
                                'CONTACTS.MODAL_OR_NEW' | translate }}</span>
                        </div>
                    </div>

                    <!-- Manual Entry / Save New -->
                    <div class="space-y-3 bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">
                                {{ 'CONTACTS.TITLE' | translate }} / {{ 'CONTACTS.MODAL_ADDRESS_PLACEHOLDER' |
                                translate }}
                            </label>
                            <div class="flex flex-col sm:flex-row gap-2">
                                <app-address-input-qr [(ngModel)]="inputAddress" class="flex-1"
                                    [placeholder]="'CONTACTS.MODAL_ADDRESS_PLACEHOLDER' | translate">
                                </app-address-input-qr>
                                <button type="button" (click)="openCreateContactModal()"
                                    class="inline-flex justify-center items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-violet-600 hover:bg-violet-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-violet-500 sm:w-auto w-full transition-colors whitespace-nowrap">
                                    <app-icon name="plus" [size]="16" class="mr-2"></app-icon>
                                    {{ 'CONTACTS.ADD_CONTACT' | translate }}
                                </button>
                            </div>
                        </div>
                    </div>

                </div>


            </div>
        </div>
    </div>
</div>

<app-contact-form-modal [isOpen]="showCreateModal" [prefillAddress]="inputAddress"
    (closeModal)="showCreateModal = false" (saveContact)="handleSaveNewContact($event)">
</app-contact-form-modal>
