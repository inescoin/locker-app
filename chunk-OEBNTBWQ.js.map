<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 sm:p-6">
      <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
        <!-- Header (fixed) -->
        <div class="flex-shrink-0 flex items-center justify-between px-6 py-4 border-b border-gray-200 bg-white">
          <h2 class="text-xl font-bold text-gray-900">Add Custom Locker</h2>
        <button 
          (click)="onClose()" 
          class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
          <app-icon name="x" [size]="20" class="text-gray-500"></app-icon>
        </button>
      </div>

      <!-- Scrollable body -->
      <div class="flex-1 overflow-y-auto p-6">
        <!-- Form -->
        <div class="space-y-4">
          <!-- Address Input -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Locker Contract Address
            </label>
            <input 
              type="text"
              [(ngModel)]="address"
              placeholder="0x..."
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none"
              [class.border-red-500]="error && error.includes('address')">
            <p *ngIf="error && error.includes('address')" class="text-red-500 text-xs mt-1">{{ error }}</p>
          </div>

          <!-- Name Input -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Locker Name <span class="text-gray-400 text-xs">(optional)</span>
            </label>
            <input 
              type="text"
              [(ngModel)]="name"
              placeholder="My Custom Locker"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none">
          </div>

          <!-- Info Box -->
          <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 flex gap-2">
            <app-icon name="information-circle" [size]="20" class="text-blue-600 flex-shrink-0 mt-0.5"></app-icon>
            <p class="text-sm text-blue-800">
              Make sure the address is a valid LockerContract deployed on the current network.
            </p>
          </div>
        </div>
      </div>

      <!-- Footer (fixed at bottom) -->
      <div class="flex-shrink-0 flex gap-3 px-6 py-4 border-t border-gray-200 bg-white">
        <button 
          (click)="onClose()"
          class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition-colors">
          Cancel
        </button>
        <button 
          (click)="onSubmit()"
          [disabled]="!address"
          class="flex-1 px-4 py-2 bg-violet-600 text-white rounded-lg font-medium hover:bg-violet-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors">
          Add Locker
        </button>
      </div>
      </div>
    </div>
