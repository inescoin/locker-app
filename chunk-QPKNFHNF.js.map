<div class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">{{ 'CONTACTS.TITLE' | translate }}</h1>
            <p class="text-gray-500 text-sm mt-1">{{ 'CONTACTS.SUBTITLE' | translate }}</p>
        </div>
        <button (click)="openAddModal()"
            class="px-4 py-2 bg-violet-600 text-white rounded-lg hover:bg-violet-700 font-medium text-sm flex items-center gap-2 transition-colors shadow-sm">
            <app-icon name="plus" [size]="16"></app-icon>
            <span class="hidden sm:inline">{{ 'CONTACTS.ADD_CONTACT' | translate }}</span>
        </button>
    </div>

    <app-contact-form-modal [isOpen]="isModalOpen" [contactToEdit]="contactToEdit" (closeModal)="closeModal()"
        (saveContact)="saveContact($event)">
    </app-contact-form-modal>



    <div class="bg-white rounded-xl shadow border border-gray-100 overflow-hidden">
        <div *ngIf="(contacts$ | async) as contacts">
            <div *ngIf="contacts.length === 0" class="p-12 text-center text-gray-500">
                <app-icon name="users" [size]="48" class="mx-auto mb-4 text-gray-300"></app-icon>
                <p class="font-medium text-lg">{{ 'CONTACTS.EMPTY_LIST' | translate }}</p>
                <p class="text-sm mt-1">{{ 'CONTACTS.EMPTY_LIST_DESC' | translate }}</p>
            </div>

            <div *ngIf="contacts.length > 0" class="divide-y divide-gray-100">
                <div *ngFor="let contact of contacts"
                    class="p-4 flex items-center justify-between hover:bg-gray-50 transition-colors">
                    <div class="min-w-0 flex-1 mr-4">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-gray-900 truncate">{{ contact.label || ('CONTACTS.UNNAMED' |
                                translate) }}</span>
                        </div>

                        <div class="flex items-center gap-2 text-sm text-gray-500 font-mono">
                            <span class="truncate">{{ contact.address }}</span>
                            <button (click)="copyAddress(contact.address)"
                                class="text-gray-400 hover:text-primary transition-colors flex-shrink-0"
                                [title]="'CONTACTS.COPY' | translate">
                                <app-icon name="clipboard" [size]="14"></app-icon>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                        <button (click)="openEditModal(contact)"
                            class="p-2 text-gray-400 hover:text-violet-600 hover:bg-violet-50 rounded-lg transition-colors"
                            [title]="'CONTACTS.EDIT' | translate">
                            <app-icon name="pencil" [size]="18"></app-icon>
                        </button>
                        <button (click)="deleteContact(contact.address)"
                            class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                            [title]="'CONTACTS.DELETE' | translate">
                            <app-icon name="trash" [size]="18"></app-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
